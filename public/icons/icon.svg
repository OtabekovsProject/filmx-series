<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e172e"/>
      <stop offset="60%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff385c"/>
      <stop offset="100%" stop-color="#e50914"/>
    </linearGradient>
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)"/>
  
  <!-- Outer Neon Border Ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#cyanGrad)" stroke-width="4" opacity="0.4"/>

  <!-- Glowing FilmX Letters -->
  <!-- "F" in Neon Cyan -->
  <g filter="url(#neonCyan)">
    <path d="M 120 140 L 220 140 L 220 185 L 175 185 L 175 235 L 210 235 L 210 280 L 175 280 L 175 372 L 120 372 Z" fill="url(#cyanGrad)" />
  </g>

  <!-- "X" in Neon Crimson Red -->
  <g filter="url(#neonRed)">
    <path d="M 260 140 L 305 140 L 345 225 L 385 140 L 430 140 L 372 256 L 435 372 L 390 372 L 345 287 L 300 372 L 255 372 L 318 256 Z" fill="url(#redGrad)" />
  </g>

  <!-- Small Cyan play pill below -->
  <g transform="translate(180, 400)">
    <rect width="152" height="34" rx="17" fill="#0d1424" stroke="#00f2fe" stroke-width="2"/>
    <polygon points="248,417 238,411 238,423" fill="#00f2fe" transform="translate(-180, -400)"/>
    <text x="76" y="22" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="2" text-anchor="middle">STREAM</text>
  </g>
</svg>
